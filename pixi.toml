[workspace]
name = "systematic-review-research-agent"
version = "0.1.0"
description = "A graduate-level social science agent that conducts systematic literature reviews: collects, verifies, classifies, and synthesizes research sources into a tagged CSV output."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = ">=3.11"

[pypi-dependencies]
anaconda-agent-runtime = { path = "packages/anaconda_agent_runtime-0.1.0-py3-none-any.whl" }
duckduckgo-mcp-server = ">=0.1.0"

[tasks]
serve = "python -m anaconda_agent_runtime serve"

[environments]
default = []
